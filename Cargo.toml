[package]
name = "screen-time"
version = "0.3.0"
edition = "2021"
publish = false

[dependencies]
chrono = { version = "0.4", features = ["clock", "serde"] }
csv = "1.3"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
base64 = "0.22"
png = "0.17"
sha2 = "0.10.9"
tao = "0.30"
tray-icon = "0.19"
wry = "0.47"
zip = { version = "0.6.6", default-features = false, features = ["deflate"] }
windows = { version = "0.58", features = ["Win32_Foundation", "Win32_System_Com", "Win32_System_Wmi", "Win32_System_Rpc", "Win32_UI_Shell_PropertiesSystem", "Win32_Storage_Packaging_Appx", "Win32_System_Threading"] }
windows-sys = { version = "0.59", features = [
  "Win32_Foundation",
  "Win32_Security",
  "Win32_System_Threading",
  "Win32_System_Power",
  "Win32_System_SystemServices",
  "Win32_System_SystemInformation",
  "Win32_System_Registry",
  "Win32_System_RemoteDesktop",
  "Win32_System_LibraryLoader",
  "Win32_System_Diagnostics_ToolHelp",
  "Win32_Graphics_Gdi",
  "Win32_Storage_FileSystem",
  "Win32_UI_Shell",
  "Win32_UI_Accessibility",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_UI_WindowsAndMessaging",
] }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
panic = "abort"
