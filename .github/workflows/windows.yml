name: Windows build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    name: MSVC x64
    runs-on: windows-2022
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install Rust target
        run: |
          rustup target add x86_64-pc-windows-msvc
          rustup component add rustfmt
      - name: Configure MSVC tools
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
      - name: Set up Node for UI tests
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Test dashboard
        run: |
          npm ci --ignore-scripts
          npm test
      - name: Test installer rollback
        shell: powershell
        run: ./tests/install.test.ps1
      - name: Test uninstaller
        shell: powershell
        run: ./tests/uninstall.test.ps1
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Run unit tests
        run: cargo test --locked --target x86_64-pc-windows-msvc
      - name: Build release
        run: cargo build --release --locked --target x86_64-pc-windows-msvc
      - name: Package release
        shell: powershell
        run: ./tools/package-release.ps1
      - name: Build and verify setup executable
        shell: powershell
        run: ./tools/build-setup.ps1
      - name: Test setup executable
        shell: powershell
        run: ./tests/setup.test.ps1
      - name: Test release package in a temporary installation
        shell: powershell
        run: ./tests/package.test.ps1
      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: windows-x64
          path: dist/*
