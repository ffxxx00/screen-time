name: Reporte de error
about: Reporta un problema reproducible sin compartir datos personales
title: "Bug: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        No adjuntes `app_usage.csv`, `paths.json`, capturas con rutas privadas ni nombres de cuenta. El proyecto registra actividad de aplicaciones en el equipo local.
  - type: input
    id: version
    attributes:
      label: Versión
      description: Versión del producto o hash del commit.
    validations:
      required: true
  - type: input
    id: windows
    attributes:
      label: Windows
      description: Edición y versión (por ejemplo, Windows 11 24H2).
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Pasos para reproducir
      placeholder: 1. Abre… 2. Haz… 3. Observa…
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Resultado esperado y resultado obtenido
    validations:
      required: true
